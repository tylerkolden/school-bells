name: Production release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, attest, and publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install -e '.[dev]'
      - name: Verify tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          expected = "v" + tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']} does not match {expected}")
          PY
      - name: Run production gates
        run: |
          ruff check .
          pytest --cov=bell --cov-report=term-missing --cov-fail-under=75
          pip-audit
          python -m build --wheel
      - name: Build offline Raspberry Pi wheelhouse
        run: |
          mkdir -p wheelhouse
          python -m pip download \
            --dest wheelhouse \
            --only-binary=:all: \
            --platform manylinux2014_aarch64 \
            --implementation cp \
            --python-version 311 \
            --abi cp311 \
            dist/bell_system-*.whl
      - name: Assemble production appliance package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p package dist/release
          git archive --format=tar HEAD bell config deploy docs scripts sounds pyproject.toml README.md | tar -xf - -C package
          cp -a wheelhouse package/wheelhouse
          python - <<'PY'
          import json, os, pathlib
          pathlib.Path("package/RELEASE.json").write_text(json.dumps({
              "schema": 1,
              "tag": os.environ["RELEASE_TAG"],
              "version": os.environ["RELEASE_TAG"].removeprefix("v"),
              "commit": os.environ["RELEASE_COMMIT"],
              "channel": "stable",
          }, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "dist/release/bell-system-${RELEASE_TAG}.tar.gz" \
            -C package bell config deploy docs scripts sounds wheelhouse pyproject.toml README.md RELEASE.json
      - name: Attest production package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/bell-system-*.tar.gz
      - name: Publish release with all assets attached
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/release/bell-system-${RELEASE_TAG}.tar.gz" \
            --draft --verify-tag --generate-notes --title "School Bell ${RELEASE_TAG}"
          gh release edit "$RELEASE_TAG" --draft=false --latest
