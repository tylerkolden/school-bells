name: Production release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, attest, and publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build and test prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install --yes --no-install-recommends -o Acquire::Retries=3 ffmpeg
          fi
          ffmpeg -version
          python -m pip install --upgrade pip 'setuptools>=83'
          python -m pip install -e '.[dev]'
      - name: Verify tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          expected = "v" + tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']} does not match {expected}")
          PY
      - name: Run production gates
        run: |
          ruff check .
          pytest --cov=bell --cov-report=term-missing --cov-fail-under=75
          pip-audit
          python -m build --wheel
      - name: Build offline Raspberry Pi wheelhouse
        run: |
          for abi in cp311 cp312 cp313; do
            mkdir -p "wheelhouse/${abi}"
            python -m pip download \
              --dest "wheelhouse/${abi}" \
              --only-binary=:all: \
              --platform manylinux2014_aarch64 \
              --implementation cp \
              --python-version "${abi#cp}" \
              --abi "${abi}" \
              dist/bell_system-*.whl
          done
      - name: Assemble production appliance package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p package dist/release
          git archive --format=tar HEAD bell config deploy docs scripts sounds pyproject.toml README.md | tar -xf - -C package
          cp -a wheelhouse package/wheelhouse
          python - <<'PY'
          import json, os, pathlib
          pathlib.Path("package/RELEASE.json").write_text(json.dumps({
              "schema": 1,
              "tag": os.environ["RELEASE_TAG"],
              "version": os.environ["RELEASE_TAG"].removeprefix("v"),
              "commit": os.environ["RELEASE_COMMIT"],
              "channel": "stable",
          }, sort_keys=True, separators=(",", ":")) + "\n")
          PY
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -czf "dist/release/bell-system-${RELEASE_TAG}.tar.gz" \
            -C package bell config deploy docs scripts sounds wheelhouse pyproject.toml README.md RELEASE.json
          install -m 0755 deploy/bootstrap.sh dist/release/install-school-bells.sh
      - name: Attest production package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/*
      - name: Publish release with all assets attached
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/release/bell-system-${RELEASE_TAG}.tar.gz" \
            "dist/release/install-school-bells.sh" \
            --draft --verify-tag --generate-notes --title "School Bell ${RELEASE_TAG}"
          gh release edit "$RELEASE_TAG" --draft=false --latest
