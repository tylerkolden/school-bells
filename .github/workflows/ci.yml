name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get install --yes --no-install-recommends -o Acquire::Retries=3 ffmpeg
          fi
          ffmpeg -version
      - name: Install project
        run: python -m pip install --upgrade pip 'setuptools>=83' && python -m pip install -e '.[dev]'
      - name: Static analysis
        run: ruff check .
      - name: Test with coverage gate
        run: pytest --cov=bell --cov-report=term-missing --cov-fail-under=75
      - name: Audit dependencies
        run: pip-audit
      - name: Build distributions
        run: python -m build

  docker-smoke:
    name: Safe Docker profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start local stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke-test UI and receiver
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/login >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:9000/health
          curl --fail --silent --show-error http://127.0.0.1:9000/events
      - name: Print container logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
